# One-shot manual workflow: downloads the Higgsfield-generated site photography
# (the coding sandbox's egress policy blocks the image CDN, GitHub runners don't)
# and commits it to this branch. Safe to delete after it has run.
name: fetch-images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images and switch references
        run: bash tools/fetch-images.sh
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Higgsfield-generated photography and switch site references"
          git push
